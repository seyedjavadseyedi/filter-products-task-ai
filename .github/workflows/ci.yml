name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run screen tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Install Google Chrome and system dependencies
        run: npx playwright install --with-deps chrome

      - name: Run browser tests
        id: browser_tests
        run: npx playwright test --reporter=line,html --trace=retain-on-failure

      - name: Upload browser failure evidence
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
